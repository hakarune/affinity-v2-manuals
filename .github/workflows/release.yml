name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (pandoc, xelatex, mdBook)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex texlive-fonts-recommended \
            texlive-latex-recommended texlive-latex-extra \
            lmodern fonts-dejavu zip
          MDBOOK_VERSION=0.4.40
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build every format
        run: bash scripts/build.sh

      - name: List artefacts
        run: ls -la dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.epub
            dist/*.pdf
            dist/*.html
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Upload as workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: manuals-dist
          path: dist/*
          if-no-files-found: warn
